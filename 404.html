<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Página não encontrada | Voz das Cidades</title>
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1218" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cstyle%3Epath%7Bstroke:%230f1720%7D@media (prefers-color-scheme:dark)%7Bpath%7Bstroke:%23ffffff%7D%7D%3C/style%3E%3Ccircle cx='16' cy='16' r='5' fill='%23e5322d'/%3E%3Cpath d='M8 8a11 11 0 000 16M24 8a11 11 0 010 16' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #ffffff; --soft: #f4f6f8; --ink: #111a24; --mute: #5d6976; --hair: #e4e8ec;
      --red: #e5322d; --red-ink: #c4231f; --hero: #111a24; --hero-mute: #aeb8c4;
      --display: "Archivo", "Inter", system-ui, sans-serif;
      --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --paper: #0d1218; --soft: #151c24; --ink: #eef2f6; --mute: #9aa6b3; --hair: #26303b; --red-ink: #ff6b66; --hero: #151c24;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --paper: #0d1218; --soft: #151c24; --ink: #eef2f6; --mute: #9aa6b3; --hair: #26303b; --red-ink: #ff6b66; --hero: #151c24;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--paper); color: var(--ink); font: 16px/1.55 var(--body); }
    a { color: inherit; }
    :focus-visible { outline: 2.5px solid var(--red); outline-offset: 3px; border-radius: 8px; }
    .wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)); }

    .top { display: flex; align-items: center; padding-block: 14px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font: 900 20px/1 var(--display); letter-spacing: -.02em; }
    .brand svg { width: 34px; height: 34px; flex: none; }
    .brand b { white-space: nowrap; }
    .brand span { color: var(--red); }

    main { flex: 1; display: flex; align-items: center; padding-block: 8px 40px; }
    .card {
      position: relative; overflow: hidden; isolation: isolate; width: 100%;
      background: var(--hero); color: #fff; border-radius: 28px; padding: clamp(32px, 7vw, 80px);
    }
    .card::after {
      content: ""; position: absolute; z-index: -1; right: -110px; top: 50%; width: 340px; height: 340px; transform: translateY(-50%); border-radius: 50%;
      border: 2px solid rgba(229,50,45,.32); box-shadow: 0 0 0 52px rgba(229,50,45,.07), 0 0 0 104px rgba(229,50,45,.04), 0 0 0 156px rgba(229,50,45,.025);
    }
    .code { margin: 0; font: 900 clamp(64px, 14vw, 128px)/.9 var(--display); letter-spacing: -.05em; color: #ff5a55; }
    h1 { margin: 18px 0 0; font: 900 clamp(30px, 5vw, 48px)/1.05 var(--display); letter-spacing: -.03em; }
    .lead { margin: 14px 0 0; max-width: 46ch; color: var(--hero-mute); font-size: clamp(16px, 2vw, 18px); }
    .dica {
      margin: 24px 0 0; max-width: 560px; padding: 14px 18px; border-radius: 16px;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); color: #d5dbe2;
    }
    .dica[hidden] { display: none; }
    .dica a { color: #fff; font-weight: 700; }
    .acoes { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
    .btn {
      display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 13px 22px; border-radius: 999px;
      text-decoration: none; font-weight: 700; transition: background .15s ease, border-color .15s ease;
    }
    .btn.pri { background: var(--red); color: #fff; }
    .btn.pri:hover { background: #cc2925; }
    .btn.sec { color: #fff; border: 1px solid rgba(255,255,255,.24); font-weight: 600; }
    .btn.sec:hover { border-color: rgba(255,255,255,.55); background: rgba(255,255,255,.05); }

    footer { border-top: 1px solid var(--hair); padding-block: 22px 28px; color: var(--mute); font-size: 13.5px; }
    @media (max-width: 760px) {
      .brand { font-size: 18px; }
      .brand svg { width: 30px; height: 30px; }
      .card { border-radius: 22px; }
    }
  </style>
</head>
<body>
  <header class="top wrap">
    <a class="brand" href="/" aria-label="Voz das Cidades, página inicial">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="5" fill="#e5322d"/><path d="M8 8a11 11 0 000 16M24 8a11 11 0 010 16" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
      <b>Voz das <span>Cidades</span></b>
    </a>
  </header>

  <main class="wrap">
    <section class="card" aria-labelledby="titulo">
      <p class="code" aria-hidden="true">404</p>
      <h1 id="titulo">Página não encontrada</h1>
      <p class="lead">O endereço pode ter mudado ou ter sido digitado com algum erro. Escolha uma cidade para continuar.</p>
      <p class="dica" id="dica" hidden></p>
      <div class="acoes">
        <a class="btn pri" href="/">Escolher uma cidade</a>
        <a class="btn sec" href="/braganca/">Abrir Radar Bragança</a>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap"><strong>Voz das Cidades</strong> · projeto independente, sem vínculo com Câmaras, Prefeituras ou partidos.</div>
  </footer>

  <script>
  (function () {
    // Dicas para endereços comuns que não existem na raiz do portal.
    var dica = document.getElementById("dica");
    var caminho = location.pathname, partes = caminho.split("/").filter(Boolean);
    var primeira = (partes[0] || "").toLowerCase();
    var secoesRadar = ["vereadores", "vereador", "propostas", "bairros", "demandas", "prefeitura", "sobre", "comparar"];
    function mostrar(texto, link, rotulo) {
      dica.textContent = texto + " ";
      var a = document.createElement("a");
      a.href = link; a.textContent = rotulo;
      dica.appendChild(a);
      dica.hidden = false;
    }
    if (secoesRadar.indexOf(primeira) !== -1) {
      // Ex.: /vereadores/ → o Radar agora fica em /braganca/vereadores/
      mostrar("O Radar Bragança agora fica em /braganca/. Esta página provavelmente está aqui:",
        "/braganca" + caminho + location.search + location.hash, "/braganca" + caminho);
    } else if (/^serra[-_]?negra/.test(primeira)) {
      mostrar("Procurando Serra Negra?", "/serranegra/", "Abrir o Radar Serra Negra");
    } else if (/^bragan(c|ç|%c3%a7)a/.test(primeira)) {
      mostrar("Procurando Bragança Paulista?", "/braganca/", "Abrir o Radar Bragança");
    }
  })();
  </script>
  <script data-goatcounter="https://radarbraganca.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
